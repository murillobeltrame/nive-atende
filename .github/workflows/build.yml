# Gera os instaladores do Mac (Apple Silicon) e do Windows.
# Roda ao enviar uma tag "v*" (cria uma Release com os instaladores) ou manualmente em Actions > Run workflow.
name: Instaladores

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            script: dist:mac
            files: release/*.dmg
          - os: windows-latest
            script: dist:win
            files: release/*.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Conferir node:sqlite no Electron
        run: npm run check:electron-sqlite

      - name: Testes
        run: npm test

      - name: Gerar instalador
        run: npm run ${{ matrix.script }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Guardar instalador
        uses: actions/upload-artifact@v4
        with:
          name: instalador-${{ matrix.os }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: instaladores
          merge-multiple: true

      - name: Publicar Release
        uses: softprops/action-gh-release@v2
        with:
          name: Nive Atende ${{ github.ref_name }}
          files: instaladores/*
          body: |
            Instaladores do Nive Atende ${{ github.ref_name }}.
            - Mac (Apple Silicon): arquivo .dmg. Arraste para Aplicativos. Se o Mac disser que o app não pode ser aberto, vá em Ajustes do Sistema > Privacidade e Segurança > "Abrir mesmo assim".
            - Windows: arquivo .exe. Se aparecer "O Windows protegeu o computador", clique em Mais informações > Executar assim mesmo.
