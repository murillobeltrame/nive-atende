# Gera os instaladores do Mac (Apple Silicon) e do Windows e publica a Release.
# Dispara quando:
#  - a versão do package.json muda na main (o próprio workflow cria a tag vX.Y.Z), ou
#  - uma tag "v*" é enviada (npm run release / "Nova versão.command"), ou
#  - manualmente em Actions > Run workflow.
name: Instaladores

on:
  push:
    branches: [main]
    paths: [package.json]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        name: Conferir versão
        run: |
          V=$(node -p "require('./package.json').version")
          TAG="v$V"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          elif git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "A versão $TAG já foi publicada; só gera os instaladores."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            script: dist:mac
            files: release/*.dmg
          # latest.yml e .blockmap são o que o app instalado lê para se atualizar sozinho
          - os: windows-latest
            script: dist:win
            files: |
              release/*.exe
              release/*.exe.blockmap
              release/latest.yml
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Conferir node:sqlite e Baileys no Electron
        run: npm run check:electron-sqlite

      - name: Testes
        run: npm test

      - name: Gerar instalador
        run: npm run ${{ matrix.script }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Guardar instalador
        uses: actions/upload-artifact@v4
        with:
          name: instalador-${{ matrix.os }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  release:
    needs: [version, build]
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: instaladores
          merge-multiple: true

      - name: Publicar Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Nive Atende ${{ needs.version.outputs.tag }}
          files: instaladores/*
          body: |
            Instaladores do Nive Atende ${{ needs.version.outputs.tag }}. O que mudou está no CHANGELOG.md.
            - Mac (Apple Silicon): arquivo .dmg. Arraste para Aplicativos. Para liberar na primeira vez, rode no Terminal: xattr -dr com.apple.quarantine "/Applications/Nive Atende.app"
            - Windows: arquivo .exe. Se aparecer "O Windows protegeu o computador", clique em Mais informações > Executar assim mesmo. A partir da 0.3.8 o programa se atualiza sozinho: avisa no topo da tela e basta clicar em Atualizar agora.
